name: Chart data

# Every hour on race day until 2am PT: pull the full field, build the ANONYMIZED chart data
# (no names, bibs, ages or locations), publish it, and redeploy the site. The raw pull with names
# stays on the runner and is never committed here; the private ironman-2026-data repo keeps that copy.
on:
  schedule:
    # GitHub drops many scheduled runs on busy hours, so each run loops hourly for ~5.5h itself (like the race
    # recorder); the schedule only restarts the loop.
    - cron: "20 */3 18,19 10 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: chart-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull, build and publish every hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STOP=$(date -u -d 2026-10-19T09:45:00Z +%s); END=$(( $(date -u +%s) + 330*60 ))
          while [ "$(date -u +%s)" -lt "$END" ] && [ "$(date -u +%s)" -lt "$STOP" ]; do
            T0=$(date -u +%s)
            git checkout -q -- . && git pull -q --rebase origin main || true
            # Pull the field and build the ANONYMIZED chart data; the raw pull stays in $RUNNER_TEMP.
            rm -rf "$RUNNER_TEMP/pull" && mkdir -p "$RUNNER_TEMP/pull"
            if (cd "$RUNNER_TEMP/pull" && node "$GITHUB_WORKSPACE/.github/scripts/pull-field.mjs" && node "$GITHUB_WORKSPACE/.github/scripts/build-marey.mjs" "data/$(cat data/latest.txt)" "$GITHUB_WORKSPACE/bradley-ironman/race/marey.json"); then
              node .github/scripts/fetch-weather.mjs bradley-ironman/wind/weather.json || echo "weather failed"
              # Never publish identifiers.
              if node -e 'const d=require("./bradley-ironman/race/marey.json"); const s=JSON.stringify(d.athletes); if (/[A-Za-z]/.test(s) || /RL78|"bib"|"pid"/.test(JSON.stringify(d))) { console.error("identifiers found"); process.exit(1); } console.log("ok:", d.athletes.length, "athletes");'; then
                git add bradley-ironman/race/marey.json bradley-ironman/wind/weather.json
                if ! git diff --cached --quiet; then
                  git commit -q -m "Update race chart data $(date -u +%H:%MZ)"
                  (git push -q origin HEAD:main || (git pull -q --rebase origin main && git push -q origin HEAD:main)) && gh workflow run pages.yml --ref main
                fi
              else git checkout -- bradley-ironman/race/marey.json; fi
            else echo "pull failed; trying again next hour"; git checkout -- bradley-ironman/race/marey.json 2>/dev/null || true; fi
            SLEEP=$(( 3600 - ($(date -u +%s) - T0) )); [ "$SLEEP" -gt 0 ] && [ $(( $(date -u +%s) + SLEEP )) -lt "$END" ] && sleep "$SLEEP" || break
          done
