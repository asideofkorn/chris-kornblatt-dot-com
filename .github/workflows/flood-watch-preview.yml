name: Update Flood Watch preview data
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/flood-watch/update_forecast.py'
      - 'scripts/flood-watch/update_reservoirs.py'
      - '.github/workflows/flood-watch-preview.yml'
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flood-watch-outlook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update reservoir observations
        run: python scripts/flood-watch/update_reservoirs.py
      - name: Update forecast
        run: python scripts/flood-watch/update_forecast.py
      - name: Validate generated JSON
        run: python -m json.tool flood-watch/data/reservoirs.json > /dev/null && python -m json.tool flood-watch/data/forecast.json > /dev/null
      - name: Commit data to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flood-watch/data/reservoirs.json flood-watch/data/forecast.json
          git diff --cached --quiet || (git commit -m "Update Flood Watch preview observations" && git push origin HEAD:feature/flood-watch-outlook)
