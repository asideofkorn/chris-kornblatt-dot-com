name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Replays recorded race-day data through the tracker; a failing test blocks the deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test browser
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Tracker tests
        working-directory: tests
        run: npm test
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp tracker version
        # A hash of the tracker's own code, so its "new version" banner ignores hourly chart-data deploys.
        run: |
          V=$(cat bradley-ironman/index.html bradley-ironman/course.js | sha256sum | cut -c1-12)
          sed -i "s/__BUILD__/$V/" bradley-ironman/index.html
          printf '{"build":"%s"}\n' "$V" > bradley-ironman/version.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
